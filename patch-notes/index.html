<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jedi Co-op patch notes</title>
<meta name="description" content="Patch notes for Jedi Co-op, the fan-made online co-op mod for Star Wars Jedi: Fallen Order.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600&family=Jost:wght@500&display=swap" rel="stylesheet">
<!-- BD-1's "Full patch notes" button in Discord comes here (Discord buttons only take web links).
     ?v=<version> opens jedicoop://patch-notes/<version> (the launcher, at that version) and shows the notes below. -->
<style>
  :root { --copper: #c98e70; --text: #e7e1d9; --muted: #a3abb4; --bg: #0b0d11; }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body { margin: 0; color: var(--text); font: 400 18px/1.55 "Barlow Semi Condensed", system-ui, sans-serif; overflow-x: hidden; }
  .hero { position: relative; min-height: 78vh; display: grid; place-items: center; padding: 48px 16px; overflow: hidden; isolation: isolate; }
  .hero img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 60% 40%; z-index: -2; filter: saturate(.9); }
  .hero::after { content: ""; position: absolute; inset: 0; z-index: -1;
    background: radial-gradient(ellipse 60% 55% at 50% 45%, rgba(8,9,12,.55), rgba(8,9,12,.82) 70%), linear-gradient(180deg, rgba(8,9,12,.2), var(--bg) 98%); }
  .stage { position: relative; width: min(620px, 100%); text-align: center; }
  svg.orbits { position: absolute; left: 50%; top: 50%; width: 560px; height: 560px; transform: translate(-50%, -58%); pointer-events: none; max-width: 140vw; }
  .rule { display: flex; align-items: center; }
  .rule i { flex: none; width: 11px; height: 11px; border-radius: 50%; border: 1.5px solid var(--copper); }
  .rule b { flex: 1; height: 1.5px; background: rgba(201,142,112,.78); }
  .label { font: 500 clamp(14px, 3.6vw, 19px)/1 Jost, sans-serif; letter-spacing: .34em; padding: 22px 0 10px; margin-left: .34em; }
  .title { font: 500 clamp(34px, 9vw, 60px)/1.15 Jost, sans-serif; letter-spacing: .12em; color: #fff; padding-bottom: 20px; margin-left: .12em; text-shadow: 0 2px 14px rgba(0,0,0,.55); }
  .hero p { color: var(--text); margin: 26px 0 0; }
  .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 20px; }
  a.btn { font: 500 15px/1 Jost, sans-serif; letter-spacing: .16em; text-transform: uppercase; text-decoration: none;
          padding: 14px 22px; border-radius: 3px; border: 1.5px solid var(--copper); color: #fff; background: rgba(8,9,12,.4); }
  a.btn.main { background: rgba(201,142,112,.28); }
  a.btn:hover, a.btn:focus-visible { background: rgba(201,142,112,.45); outline: none; }
  .hint { font-size: 15px; color: var(--muted); }
  main.notes { width: min(760px, 100%); margin: 0 auto; padding: 8px 16px 72px; }
  article { border-top: 1.5px solid rgba(201,142,112,.35); padding: 28px 0 8px; scroll-margin-top: 16px; }
  article.focus h2 { color: #fff; }
  h2 { font: 500 26px/1.2 Jost, sans-serif; letter-spacing: .12em; margin: 0 0 6px; color: var(--text); }
  h2 small { font: 600 13px/1 "Barlow Semi Condensed", sans-serif; letter-spacing: .14em; color: var(--copper); margin-left: 10px; vertical-align: middle; }
  h3 { font: 500 15px/1.3 Jost, sans-serif; letter-spacing: .22em; text-transform: uppercase; color: var(--copper); margin: 22px 0 6px; }
  ul { margin: 6px 0 0; padding-left: 20px; }
  li { margin: 6px 0; }
  li::marker { color: var(--copper); }
  .status { color: var(--muted); text-align: center; padding: 24px 0; }
  footer { text-align: center; font-size: 13px; color: rgba(231,225,217,.5); padding: 0 16px 28px; }
</style>
</head>
<body>
<section class="hero">
  <img src="../art/steam-12.jpg" alt="">
  <div class="stage">
    <svg class="orbits" viewBox="0 0 400 400" fill="none" aria-hidden="true">
      <circle cx="200" cy="200" r="190" stroke="rgba(201,142,112,.24)"/>
      <circle cx="200" cy="200" r="148" stroke="rgba(201,142,112,.32)" stroke-dasharray="2 6"/>
      <circle cx="200" cy="200" r="62" stroke="rgba(201,142,112,.28)"/>
      <path d="M200 10 A190 190 0 0 1 368 112" stroke="rgba(201,142,112,.7)" stroke-width="1.4"/>
      <path d="M84 292 A148 148 0 0 0 238 343" stroke="rgba(201,142,112,.6)" stroke-width="1.4"/>
      <path d="M200 0 V400" stroke="rgba(201,142,112,.14)"/>
      <circle cx="200" cy="10" r="4" fill="rgba(201,142,112,.85)"/>
      <circle cx="368" cy="112" r="3" fill="rgba(201,142,112,.75)"/>
      <circle cx="84" cy="292" r="3" fill="rgba(201,142,112,.75)"/>
      <circle cx="122" cy="74" r="7" stroke="rgba(201,142,112,.5)"/>
    </svg>
    <div class="rule"><i></i><b></b><i></i></div>
    <div class="label">PATCH NOTES</div>
    <div class="title" id="title">JEDI CO-OP</div>
    <div class="rule"><i></i><b></b><i></i></div>
    <p id="msg">Opening the Jedi Co-op launcher…</p>
    <div class="actions">
      <a class="btn main" id="open" href="jedicoop://patch-notes">Open in the launcher</a>
      <a class="btn" href="#notes">Read them here</a>
    </div>
    <p class="hint">The launcher opens these links from version 1.2.2.</p>
  </div>
</section>
<main class="notes" id="notes"><p class="status" id="status">Loading the patch notes…</p></main>
<footer>A fan-made mod, not affiliated with EA, Respawn or Lucasfilm. Game screenshots © Electronic Arts and Lucasfilm.</footer>
<script>
  // Only a version number is accepted from the address; nothing else reaches the link or the page.
  var v = new URLSearchParams(location.search).get("v") || "";
  if (!/^[0-9][0-9A-Za-z.+-]{0,31}$/.test(v)) v = "";
  var link = "jedicoop://patch-notes" + (v ? "/" + v : "");
  document.getElementById("open").href = link;
  if (v) {
    document.getElementById("title").textContent = "VERSION " + v;
    document.title = "Jedi Co-op " + v + " patch notes";
  }
  // Try once on arrival; the browser asks before it opens the launcher.
  setTimeout(function () { location.href = link; }, 400);
  setTimeout(function () { document.getElementById("msg").textContent = "Not opening? Read the notes below."; }, 3000);

  // The notes: the mod channel's changelog (the same text the launcher shows), as plain text nodes only.
  var CHANNEL = "https://raw.githubusercontent.com/MattE-ui/jedicoop-releases/main/mod.json";
  function el(tag, text, cls) { var e = document.createElement(tag); if (text != null) e.textContent = text; if (cls) e.className = cls; return e; }
  function strip(s) { return s.replace(/\*\*([^*]+)\*\*/g, "$1").replace(/`([^`]+)`/g, "$1").replace(/\*([^*]+)\*/g, "$1"); }
  function render(md) {
    var out = document.getElementById("notes"), art = null, list = null, focus = null, n = 0;
    out.textContent = "";
    md.replace(/\r\n?/g, "\n").split("\n").forEach(function (raw) {
      var line = raw.replace(/\s+$/, ""), m;
      if ((m = /^##\s+(.+)$/.exec(line))) {
        art = el("article"); art.id = "v" + m[1].trim();
        var h = el("h2", m[1].trim()); if (n++ === 0) h.appendChild(el("small", "LATEST"));
        art.appendChild(h); out.appendChild(art); list = null;
        if (m[1].trim() === v) { focus = art; art.className = "focus"; }
      } else if (!art) {
      } else if ((m = /^\*\*(.+)\*\*$/.exec(line))) { art.appendChild(el("h3", m[1])); list = null; }
      else if ((m = /^-\s+(.*)$/.exec(line))) { if (!list) art.appendChild(list = el("ul")); list.appendChild(el("li", strip(m[1]))); }
      else if (/^\s{2,}\S/.test(raw) && list && list.lastChild) { list.lastChild.textContent += " " + strip(line.trim()); }
      else if (line.trim()) { art.appendChild(el("p", strip(line.trim()))); list = null; }
      else list = null;
    });
    if (!n) out.appendChild(el("p", "No patch notes yet.", "status"));
    if (focus && location.hash !== "#notes") setTimeout(function () { focus.scrollIntoView({ block: "start" }); }, 3200);
  }
  fetch(CHANNEL, { cache: "no-store" }).then(function (r) { return r.json(); }).then(function (j) { render(j.changelog || ""); })
    .catch(function () { document.getElementById("status").textContent = "The patch notes couldn't load. Open them in the launcher instead."; });
</script>
</body>
</html>
